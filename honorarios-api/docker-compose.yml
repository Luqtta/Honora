services:
  postgres:
    image: postgres:16-alpine
    container_name: honora-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-honora}
      POSTGRES_USER: ${POSTGRES_USER:-honora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-honora}
    volumes:
      - honora-pgdata:/var/lib/postgresql/data

volumes:
  honora-pgdata:
