spring:
  application:
    name: honorarios-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/honora}
    username: ${DB_USERNAME:honora}
    password: ${DB_PASSWORD:honora}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}   # Railway injeta PORT; local cai no 8080
  error:
    include-stacktrace: never   # nunca vaza stacktrace no body
    include-message: never
  tomcat:
    threads:
      max: 50

jwt:
  secret: ${JWT_SECRET:}   # sem default: obrigatorio em todo ambiente (a app falha no startup se vazio/fraco)
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  origin: ${CORS_ORIGIN:http://localhost:5173}   # origem(s) do frontend, separadas por virgula
